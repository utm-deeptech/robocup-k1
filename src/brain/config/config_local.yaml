brain_node:
  ros__parameters:
    game:
      team_id: 1
      player_id: 1
      player_role: striker
      number_of_players: 3
    strategy:
      cooperation:
        enable_role_switch: false
    vision:
      image_camera_info_topic: /rgbd_camera/rgb/camera_info
      depth_image_topic: /rgbd_camera/depth/image_raw
      depth_camera_info_topic: /rgbd_camera/depth/camera_info
    RLVisionKick:
      # Kick policy walks up and shoots by itself once in soccer mode (k1-soccer-strategy skill).
      # Booster's default AI hands over below 2.5 m with no angle gate.
      enableAutoVisualKick: true
      autoVisualKickEnableDistMax: 2.5
      autoVisualKickEnableAngle: 0.8
